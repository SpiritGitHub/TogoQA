[project]
name = "togoqa"
version = "0.1.0"
description = "Système de question-réponse fiable, vérifiable et conscient de son incertitude sur les données éducatives du Togo"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Azhar Barde", email = "bardesteven17@gmail.com" },
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pgvector>=0.3",
    "alembic>=1.13",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "trafilatura>=1.12",
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "camelot-py[base]>=0.11",
    "pandas>=2.2",
    "numpy>=1.26",
    "sentence-transformers>=3.0",
    "transformers>=4.44",
    "accelerate>=0.33",
    "torch>=2.4",
    "scikit-learn>=1.5",
    "rank-bm25>=0.2",
    "dateparser>=1.2",
    "duckdb>=1.0",
    "redis>=5.0",
    "celery>=5.4",
    "mlflow>=2.16",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pre-commit>=3.8",
]

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
